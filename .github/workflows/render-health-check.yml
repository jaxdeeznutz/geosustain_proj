name: GeoSustain Render health check

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: geosustain-render-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request the public health endpoint
        run: >-
          curl --fail --silent --show-error --output /dev/null
          --connect-timeout 10 --max-time 90
          --retry 2 --retry-delay 5 --retry-max-time 180
          https://geosustain.onrender.com/health
