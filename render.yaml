services:
  - type: web
    name: geosustain-backend
    env: python
    buildCommand: pip install --upgrade pip==26.2.2 setuptools==84.2.1 && pip install -r backend/requirements.txt
    startCommand: cd backend && python verify_model.py && uvicorn fastapi_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANALYSIS_JOBS_ENABLED
        value: "1"
