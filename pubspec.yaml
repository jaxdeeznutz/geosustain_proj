name: geosustain_clean_arranged
description: "GeoSustain agricultural land analysis and planning support."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  latlong2: ^0.9.1
  flutter_map: ^7.0.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  http: ^1.2.2
  printing: ^5.13.4
  pdf: ^3.11.1
  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8
  firebase_core: 4.0.0
  firebase_messaging: 16.0.0
  firebase_auth: 6.0.0
  google_sign_in: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  assets:
    - assets/images/dashboard/
    - assets/fonts/

  uses-material-design: true




